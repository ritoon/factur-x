# Codecov settings, read from .github/: https://docs.codecov.com/docs/codecov-yaml
coverage:
  status:
    # Show the coverage on pull requests without failing them.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  # The code generators, run by hand with go generate, and the PDF builder of
  # the tests.
  - "internal/**/gen/**"
  - "internal/pdf/pdftest/**"
