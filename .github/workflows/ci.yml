name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version allowed by go.mod, and the latest release.
        go: ['1.24.x', 'stable']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then
            echo "Files not formatted with gofmt:"
            echo "$files"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        # -coverpkg counts the code of every package reached by the tests,
        # such as the rule sets exercised through package validate.
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Build the command
        run: go build ./cmd/zerechnung
      - name: Upload the coverage to Codecov
        if: matrix.go == 'stable'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    # Settings in .golangci.yml: staticcheck, errcheck, doc comments of the
    # exported symbols (revive) and their final period (godot).
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  fuzz:
    name: Fuzzing (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Fuzz the PDF reader and the Flate codec
        run: |
          go test -run '^$' -fuzz '^FuzzOpen$' -fuzztime 30s ./internal/pdf
          go test -run '^$' -fuzz '^FuzzInflate$' -fuzztime 30s ./internal/pdf
          go test -run '^$' -fuzz '^FuzzDeflate$' -fuzztime 30s ./internal/pdf
      - name: Fuzz the XML reader against encoding/xml
        run: go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 30s ./internal/xmltree
      - name: Fuzz the quick BT-24 reading against xmltree
        run: go test -run '^$' -fuzz '^FuzzSpecificationID$' -fuzztime 30s .

  bench:
    # The benchmark harness is made of separate modules; only the one that
    # measures this package is compiled here, the others need ./run.sh setup.
    name: Benchmark module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: go vet
        run: |
          cd bench/ecosystem/facturx && go vet ./...
          cd ../report && go vet ./...
          cd ../../polyglot/report && go vet ./...
